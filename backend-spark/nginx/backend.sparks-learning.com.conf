# Nginx Configuration for backend.sparks-learning.com
# Place this file in /etc/nginx/sites-available/backend.sparks-learning.com
# Enable by linking: sudo ln -s /etc/nginx/sites-available/backend.sparks-learning.com /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name backend.sparks-learning.com;

    # Allow larger payloads for uploads (videos, images, reels)
    client_max_body_size 100M;

    # Reverse proxy for Node.js API & Socket.io
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # WebSocket support (Required for Socket.IO)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable proxy buffering for streaming / websockets
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;

        # Connection Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
    }
}

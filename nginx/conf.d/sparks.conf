# ─── Shared ───
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream sparks_api   { server api:5000; keepalive 32; }
upstream sparks_admin { server admin:80; }

server_tokens off;

# ─── HTTP: ACME challenge + redirect to HTTPS ───
server {
    listen 80;
    listen [::]:80;
    server_name api.sparks-learning.com admin.sparks-learning.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── api.sparks-learning.com ───
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.sparks-learning.com;

    ssl_certificate     /etc/letsencrypt/live/api.sparks-learning.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.sparks-learning.com/privkey.pem;
    include /etc/nginx/conf.d/ssl-params.inc;

    # Video + thumbnail multipart uploads (100MB each)
    client_max_body_size 250M;
    client_body_timeout 300s;

    # Socket.IO (websocket)
    location /socket.io/ {
        proxy_pass http://sparks_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass http://sparks_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

# ─── admin.sparks-learning.com ───
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.sparks-learning.com;

    ssl_certificate     /etc/letsencrypt/live/admin.sparks-learning.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.sparks-learning.com/privkey.pem;
    include /etc/nginx/conf.d/ssl-params.inc;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://sparks_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
